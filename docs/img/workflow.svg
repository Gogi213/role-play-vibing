<text x="530" y="262" class="s">dispatch.py, 15 s tick</text>
<text x="530" y="276" class="s">starts the role each</text>
<text x="530" y="290" class="s">ticket calls for</text>
<polyline class="e" points="615,110 615,218" marker-end="url(#mk-e-w)"/>
<text x="625" y="160" class="l">reads tickets</text>
<text x="625" y="174" class="l">every 15 s</text>
<rect class="n-group" x="800" y="170" width="280" height="244" rx="8"/>
<text x="812" y="190" class="t">Roles: a short claude -p session per run</text>
<rect class="n-model" x="812" y="202" width="256" height="62" rx="6"/>
<text x="822" y="221" class="t">Researcher · Sonnet 5.5 high</text>
<text x="822" y="237" class="s">protocol, calculation, report</text>
<text x="822" y="251" class="s">done · pr → next: judge</text>
<rect class="n-model" x="812" y="270" width="256" height="62" rx="6"/>
<text x="822" y="289" class="t">Engineer · Sonnet 5.5 xhigh</text>
<text x="822" y="305" class="s">code, tests, machines</text>
<text x="822" y="319" class="s">done · pr → next: judge</text>
<rect class="n-model" x="812" y="338" width="256" height="62" rx="6"/>
<text x="822" y="357" class="t">Judge · Opus 5.5 high</text>
<text x="822" y="373" class="s">reviews every result</text>
<text x="822" y="387" class="s">accept → done · return → executor</text>
<polyline class="e" points="710,270 796,270" marker-end="url(#mk-e-w)"/>
<text x="753" y="262" class="l" text-anchor="middle">claude -p</text>
<polyline class="e" points="940,170 940,75 714,75" marker-end="url(#mk-e-w)"/>
<text x="827" y="67" class="l" text-anchor="middle">tickets.py result → status, next</text>
<path class="n-file" d="M230 450H410L420 460V506H230Z"/>
<path class="n-fold" d="M410 450V460H420"/>
<text x="240" y="472" class="m">ceo-inbox.md</text>
<text x="240" y="490" class="m">ceo-wake.log</text>
<polyline class="e-w" points="615,320 615,478 424,478" marker-end="url(#mk-w-w)"/>
<text x="605" y="400" class="l-w" text-anchor="end">done · blocked ·</text>
<text x="605" y="414" class="l-w" text-anchor="end">needs_owner · next: ceo</text>
<polyline class="e-w" points="325,450 325,124" marker-end="url(#mk-w-w)"/>
<text x="333" y="300" class="l-w">Monitor on ceo-wake.log</text>
<text x="333" y="314" class="l-w">wakes the CEO</text>
<rect class="n-code" x="230" y="530" width="190" height="52" rx="6"/>
<text x="240" y="550" class="t">Watcher</text>
<text x="240" y="568" class="s">watch.py: orphan tickets, dead waits</text>
<polyline class="e-w" points="300,530 300,510" marker-end="url(#mk-w-w)"/>
<rect class="n-model" x="800" y="460" width="280" height="62" rx="6"/>
<text x="810" y="479" class="t">Overseer</text>
<text x="810" y="495" class="s">overseer.py, every 15 min: cost rules</text>
<text x="810" y="509" class="s">and Haiku reading ticket logs</text>
<polyline class="e" points="940,460 940,402" marker-end="url(#mk-e-w)"/>
<text x="950" y="440" class="l">finding → next: judge</text>
<polyline class="e" points="690,320 690,604 85,604 85,114" marker-end="url(#mk-e-w)"/>
<text x="390" y="596" class="l" text-anchor="middle">Telegram (send-only bot): daily report, owner questions, work-stalled alarm</text>
<rect class="n-code" x="800" y="548" width="22" height="14" rx="3"/>
<text x="830" y="559" class="s">code, free</text>
<rect class="n-model" x="920" y="548" width="22" height="14" rx="3"/>
<text x="950" y="559" class="s">model run, paid</text>
<path class="n-file" d="M800 572H814L822 580V586H800Z"/>
<text x="830" y="583" class="s">file</text>
<line class="e-w" x1="920" y1="579" x2="942" y2="579"/>
<text x="950" y="583" class="s">path that wakes the CEO</text>
</g>
<rect class="n-model" x="230" y="20" width="190" height="62" rx="6"/>
<text x="240" y="41" class="t">Secretary · Haiku 5.5</text>
<text x="240" y="60" class="s">records your words verbatim</text>
<polyline class="e" points="325,140 325,86" marker-end="url(#mk-e-w)"/>
<text x="333" y="108" class="l">your words,</text>
<text x="333" y="122" class="l">verbatim</text>
