<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 730" width="1100" height="730" role="img" aria-labelledby="t-w d-w">
<title id="t-w">How Role Play Vibing works</title>
<desc id="d-w">The owner tells the CEO what they want. The CEO hands the words to the Secretary, who records them in the owner's registry as a decision or a goal, and then files a ticket that must reference that record. The dispatcher reads tickets every 15 seconds and starts the role each ticket calls for as a short claude -p session. Roles report with tickets.py result, which sets status and next. Executors hand results to the Judge, who accepts or returns them. Done and stuck tickets, plus watcher findings, are written to ceo-inbox.md and ceo-wake.log, and a Monitor wakes the CEO. The Overseer sends findings to the Judge. Telegram carries the daily report, owner questions and the work-stalled alarm.</desc>
<style>
  :root{--bg:#F6F8FA;--surface:#FFFFFF;--fg:#1F2933;--muted:#586471;--line:#AEB9C4;--model-bg:#E1EDFB;--model-line:#3A6EA5;--wake:#B83A08;--wake-bg:#FCEBE2}
  @media (prefers-color-scheme: dark){:root{--bg:#0E141A;--surface:#161E26;--fg:#E4EAF0;--muted:#98A5B1;--line:#4A5A68;--model-bg:#14283B;--model-line:#6FA8E0;--wake:#FF9A66;--wake-bg:#3B2216}}
  .bg{fill:var(--bg)}
  .n-code{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
  .n-model{fill:var(--model-bg);stroke:var(--model-line);stroke-width:1.4}
  .n-file{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
  .n-fold{fill:none;stroke:var(--line);stroke-width:1.2}
  .n-group{fill:none;stroke:var(--line);stroke-width:1.2}
  .n-wake{fill:var(--wake-bg);stroke:var(--wake);stroke-width:1.4}
  .t{fill:var(--fg);font:600 12px system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  .s{fill:var(--muted);font:400 11px system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  .m{fill:var(--fg);font:500 11px ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
  .l{fill:var(--muted);font:400 11px system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  .l-w{fill:var(--wake);font:600 11px system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  .e{fill:none;stroke:var(--fg);stroke-width:1.4}
  .e-w{fill:none;stroke:var(--wake);stroke-width:2.2}
  .dot{fill:var(--fg)}
  .mk-e{fill:var(--fg)}
  .mk-w{fill:var(--wake)}
</style>
<defs><marker id="mk-e-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path class="mk-e" d="M0 0L10 5L0 10z"/></marker><marker id="mk-w-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path class="mk-w" d="M0 0L10 5L0 10z"/></marker><marker id="mk-b-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="mk-e" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" width="1100" height="730" rx="10"/>
<g transform="translate(0,110)">
<rect class="n-code" x="20" y="40" width="130" height="70" rx="6"/>
<text x="30" y="66" class="t">Owner</text>
<text x="30" y="84" class="s">you</text>
<polyline class="e" points="150,75 226,75" marker-start="url(#mk-b-w)" marker-end="url(#mk-b-w)"/>
<text x="188" y="62" class="l" text-anchor="middle">tasks,</text>
<text x="188" y="98" class="l" text-anchor="middle">answers</text>
<rect class="n-model" x="230" y="30" width="190" height="90" rx="6"/>
<text x="240" y="54" class="t">CEO</text>
<text x="240" y="72" class="s">long-lived session (/ceo)</text>
<text x="240" y="86" class="s">talks to you, files tickets</text>
<polyline class="e" points="420,75 516,75" marker-end="url(#mk-e-w)"/>
<text x="468" y="62" class="l" text-anchor="middle">tickets.py new</text>
<path class="n-file" d="M520 40H700L710 50V110H520Z"/>
<path class="n-fold" d="M700 40V50H710"/>
<text x="530" y="61" class="m">TK-NNN.md</text>
<text x="530" y="79" class="s">header: status, next</text>
<text x="530" y="93" class="s">log of every step</text>
<rect class="n-code" x="520" y="220" width="190" height="100" rx="6"/>
