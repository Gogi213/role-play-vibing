:root {

  --blue-bg: #1B3355; --blue-fg: #A9CBFF; --blue-line: #2D4A73;
  --gray-bg: #1E2430; --gray-fg: #7C8494; --gray-line: #2A3140;
  --amber-bg: #F2B84B; --amber-fg: #1A1405; --amber-line: #F2B84B;
  --f: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: dark;
}

    --green: #1F8A52; --blue: #2B6FD1; --amber: #A8680A; --red: #C0392B;
    --line: #D0D5DD; --sep: #E1E4EA; --arrow: #9AA2B1; --keybg: #DDE1E8;
    --run-bg: #E6EFFC; --wait-bg: #FBF1DC; --bad-bg: #FBE7E4; --done-line: #9FD3B5; --sel: #EBEEF4;
    --ask-bg: #FBF4E4; --wait-row: #F6E7C4; --on-amber: #1A1405; --brand-bg: #0E1014; --brand-ink: #F4F5F7;
    --purple-bg: #E3DBF7; --purple-fg: #3A2F5C; --purple-line: #B9A9E6;
    --teal-bg: #CDEFF2; --teal-fg: #0F4A50; --teal-line: #7CC9CF;
    --blue-bg: #D6E4FA; --blue-fg: #1B3355; --blue-line: #93B4E6;
    --gray-bg: #E4E7EC; --gray-fg: #5B6270; --gray-line: #CBD0D8;
    --amber-line: #D79B2B; color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #F4F5F7; --head: #E4E7EC; --ink: #2A3140; --dim: #6B7384; --strong: #0E1014;
  --green: #1F8A52; --blue: #2B6FD1; --amber: #A8680A; --red: #C0392B;
  --line: #D0D5DD; --sep: #E1E4EA; --arrow: #9AA2B1; --keybg: #DDE1E8;
  --run-bg: #E6EFFC; --wait-bg: #FBF1DC; --bad-bg: #FBE7E4; --done-line: #9FD3B5; --sel: #EBEEF4;
  --ask-bg: #FBF4E4; --wait-row: #F6E7C4; --on-amber: #1A1405; --brand-bg: #0E1014; --brand-ink: #F4F5F7;
  --purple-bg: #E3DBF7; --purple-fg: #3A2F5C; --purple-line: #B9A9E6;
  --teal-bg: #CDEFF2; --teal-fg: #0F4A50; --teal-line: #7CC9CF;
  --blue-bg: #D6E4FA; --blue-fg: #1B3355; --blue-line: #93B4E6;
  --gray-bg: #E4E7EC; --gray-fg: #5B6270; --gray-line: #CBD0D8;
  --amber-line: #D79B2B; color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.5 var(--f); font-variant-ligatures: none; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 16px 24px; display: grid; gap: 14px; }
.d { color: var(--dim); } .g { color: var(--green); } .b { color: var(--blue); } .a { color: var(--amber); } .r { color: var(--red); }
.w { color: var(--strong); } .k { font-weight: 700; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, summary:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 18px; margin: 0 -16px; padding: 8px 16px; background: var(--head); }
.brand { font-weight: 700; background: var(--brand-bg); color: var(--brand-ink); padding: 0 .8ch; border-radius: 3px; }
.hl { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline; }
.sec { color: var(--dim); font-weight: 700; letter-spacing: .15ch; text-transform: uppercase; margin: 6px 0 -4px; }
.sec span { font-weight: 400; text-transform: none; letter-spacing: 0; }

.tg { display: inline-block; padding: 0 .6ch; border-radius: 3px; font-weight: 700; white-space: nowrap; }
.tg-purple { background: var(--purple-bg); color: var(--purple-fg); } .tg-teal { background: var(--teal-bg); color: var(--teal-fg); }
.tg-blue { background: var(--blue-bg); color: var(--blue-fg); } .tg-gray { background: var(--gray-bg); color: var(--gray-fg); }
.tg-amber { background: var(--amber-bg); color: var(--amber-fg); }
.key { display: inline-block; background: var(--keybg); color: var(--strong); padding: 0 .7ch; border-radius: 3px; font-weight: 700; }

.notice { padding: 8px 12px; border: 1px solid var(--amber); border-radius: 6px; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
.notice.bad { border-color: var(--red); }
.notice button { border: 1px solid var(--line); border-radius: 4px; padding: 3px 10px; }

.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.card { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; min-width: 0; }
.card.off { border-style: dashed; } .card.down { border-color: var(--red); }
.card .top { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.card .load { margin-top: 4px; overflow-wrap: anywhere; }

.proc { border-bottom: 1px solid var(--sep); }
.proc > button { display: block; width: 100%; text-align: left; padding: 10px 6px 8px; border-left: 3px solid transparent; border-radius: 2px; }
.proc.open > button, .proc > button:hover { background: var(--sel); }
.proc.open > button { border-left-color: var(--blue); }
.phead { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; margin-bottom: 8px; }
.phead .l { min-width: 0; overflow-wrap: anywhere; }
.pipe { display: flex; flex-wrap: wrap; align-items: stretch; gap: 6px 0; }
.chip { border: 1px solid var(--line); border-radius: 6px; padding: 4px 1ch; width: 23ch; min-width: 0; overflow-wrap: anywhere; }
.chip.done { border-color: var(--done-line); } .chip.run { border-color: var(--blue); background: var(--run-bg); }
.chip.wait { border-color: var(--amber-line); background: var(--wait-bg); } .chip.todo { border-style: dashed; }
.chip.bad { border-color: var(--red); background: var(--bad-bg); }
.arr { width: 4ch; text-align: center; align-self: center; color: var(--arrow); white-space: pre; }

.detail { padding: 6px 6px 14px 16px; display: grid; gap: 12px; }
.flow { overflow-wrap: anywhere; }
.srow { display: grid; grid-template-columns: 3ch minmax(0, 1.3fr) minmax(0, 2fr) minmax(0, 1.4fr) 9ch; gap: 2px 12px; padding: 2px 6px; }
.srow.head { background: var(--green); color: #0B0D10; font-weight: 700; }
.srow.wait { background: var(--wait-row); }
.srow .meta { display: flex; flex-wrap: wrap; gap: 0 10px; min-width: 0; }
.sdet { padding: 0 6px 2px calc(3ch + 18px); color: var(--dim); overflow-wrap: anywhere; }
.q { border: 1px solid var(--amber-line); background: var(--ask-bg); border-radius: 6px; padding: 10px 14px; display: grid; gap: 6px; min-width: 0; }
.q .qt { overflow-wrap: anywhere; }
.opts { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; }
.opt { text-align: left; padding: 2px 4px; border-radius: 4px; }
.opt:hover { background: var(--keybg); }
.opt .eff { display: block; color: var(--dim); font-size: 12px; margin-left: 2.4ch; }
.confirm { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; background: var(--amber); color: var(--on-amber); padding: 6px 10px; border-radius: 4px; font-weight: 700; }
.confirm button { background: var(--on-amber); color: var(--amber); padding: 2px 12px; border-radius: 3px; }
.confirm button.no { background: transparent; color: var(--on-amber); border: 1px solid var(--on-amber); }

.bottom { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 10px; }
.box { border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; min-width: 0; display: grid; gap: 8px; align-content: start; }
.box.ask { border-color: var(--amber-line); background: var(--ask-bg); }
.feedrow { overflow-wrap: anywhere; }
.toast { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); background: var(--head); color: var(--strong); border: 1px solid var(--line); padding: 8px 14px; border-radius: 6px; max-width: calc(100vw - 32px); z-index: 5; }
.toast.err { border-color: var(--red); }
.legend { color: var(--dim); font-size: 12px; overflow-wrap: anywhere; }

@media (max-width: 720px) {
  .bottom { grid-template-columns: minmax(0, 1fr); }
  .chip { width: calc(50% - 2ch); min-width: 16ch; }
  .arr { width: 3ch; }
  .srow { grid-template-columns: 3ch minmax(0, 1fr); }
  .srow > :nth-child(n+3) { grid-column: 2; }
  .srow.head { display: none; }
  .sdet { padding-left: calc(3ch + 12px); }
  .detail { padding-left: 4px; padding-right: 0; }
}
</style>

    if (st === "done" && s.pct != null) l1.append(" ", sp("g", s.pct + " %"));
    if (st === "run") l1.append(" ", sp("b", s.eta_min != null ? "~" + mins(s.eta_min) : s.pct != null ? s.pct + " %" : ""));
    const l2 = el("div"); l2.append(tag(s.on));
    const who = st === "bad" ? s.for : s.who !== "вы" ? s.who : "";
    if (who) l2.append(" ", sp("d", who));
    ch.append(l1, l2);
    return ch;
  }

  // ---- ответ -------------------------------------------------------------------------------------------------------
  function pickAnswer(q, o) { pending = { q, o }; render(); }
  async function sendAnswer(q, o) {
    pending = null;
    if (!mcp || isSample) { toast("Пример: ответ не отправлен — живые данные в приложении Claude на компьютере с проектом."); render(); return; }
    try {
      await mcp.callTool(SERVER, "pulse_answer", { id: q.id, key: o.key }, { cache: false, signal: AbortSignal.timeout ? AbortSignal.timeout(15000) : undefined });
      answered[q.id] = o.label; toast("Ответ записан");
      render(); poll();
    } catch (e) {
      toast("Ответ не записан: " + ((e && e.message) || "ошибка") + (e && e.code === "tool_error" ? "" : ""), true); render();
    }
  }
  function questionBlock(q, withTitle) {
    const box = el("div", "q");
    const head = el("div", "qt"); add(head, sp("tg tg-amber", "ВОПРОС " + q.n), "  ", sp("w k", q.text), "  ", sp("d", "спросил " + (q.from || "") + " с "), tag(q.on));
    box.append(head);
    if (answered[q.id]) { box.append(add(el("div"), sp("g", "✓ ответ записан: "), sp("d", answered[q.id]))); return box; }
    const opts = el("div", "opts");
    for (const o of q.options || []) {
      const b = el("button", "opt"); b.type = "button";
      add(b, sp("key", o.key), " ", o.label);
      if (o.effect) { const e = el("span", "eff"); e.append("→ ", linkify(o.effect)); b.append(e); }
      b.onclick = () => pickAnswer(q, o);
      opts.append(b);
    }
    box.append(opts);
    if (pending && pending.q.id === q.id) {
      const c = el("div", "confirm"); c.setAttribute("role", "alert");
      const yes = el("button", "", "Да"), no = el("button", "no", "Нет"); yes.type = no.type = "button";
      yes.onclick = () => sendAnswer(pending.q, pending.o); no.onclick = () => { pending = null; render(); };
      add(c, `Ответить «${pending.o.label}» на вопрос ${q.n}?`, yes, no); box.append(c);
    }
    return box;
  }

  // ---- разделы -----------------------------------------------------------------------------------------------------
  function renderHead() {
    $("time").textContent = data.time || "--:--";
    const hl = $("hl"); hl.replaceChildren();
    const h = data.headline || {}, c = data.counters || {};
    const [ic, col] = { wait: ["⏸", "a"], bad: ["✗", "r"] }[h.state] || ["●", "g"];
    hl.append(sp(col + " k", ic + " " + (h.text || "")));
    add(hl, add(sp(), sp("d", "шаги "), sp("g", "✓" + (c.done || 0)), " ", sp("b", "▸" + (c.run || 0)), " ", sp("a", "⏸" + (c.wait || 0)), " ", sp("d", "○" + (c.todo || 0))));
    if (c.bad) hl.append(sp("r", `✗ ${c.bad} ${(data.machines || []).some((m) => m.orphans) ? "без хозяина" : "проблем"}`));
  }
  function renderCards() {
    const box = $("cards"); box.replaceChildren();
    for (const m of data.machines || []) {
      const t = tags()[m.id] || { name: m.id, color: "gray" };
      const card = el("div", "card " + (m.state === "off" ? "off" : m.state === "down" ? "down" : ""));
      card.style.borderColor = m.state === "down" ? "var(--red)" : m.state === "off" ? "var(--gray-line)" : "var(--" + t.color + "-line)";
      const top = el("div", "top");
      add(top, add(sp(), tag(m.id), " ", sp(m.state === "off" ? "d k" : "w k", t.name)), m.state === "down" ? sp("r", "✗ нет связи") : m.state === "off" ? sp("d", "○ выключен") : sp("g", "● в сети"));
      card.append(top, el("div", "load d", m.load || ""));
      const now = m.now || {}, nw = el("div");
      if (now.state === "off") nw.append(sp("d", now.text || ""));
      else { nw.append("сейчас ", sp({ run: "b", wait: "a", bad: "r" }[now.state] || "d", ({ run: "▸ ", wait: "⏸ ", bad: "✗ " }[now.state] || "") + (now.text || ""))); if (m.orphans) nw.append(sp("d", " · "), sp("r", "✗ " + m.orphans)); }
      card.append(nw); box.append(card);
    }
  }
  function stepsTable(p) {
    const wrap = el("div"), qm = qmap();
    const head = el("div", "srow head"); for (const h of ["#", "ШАГ", "КТО · ДЕЛАЕТСЯ НА · ДЛЯ", "СТАТУС", "ВРЕМЯ"]) head.append(el("span", "", h));
    wrap.append(head);
    (p.steps || []).forEach((s, k) => {
      const st = s.state || "todo", dim = st === "todo", q = qm[s.question || ""];
      const row = el("div", "srow " + st);
      row.append(sp(st === "wait" ? "a k" : st === "run" ? "b k" : "d", String(s.n)), sp(dim ? "d" : st === "wait" || st === "run" ? "w k" : "w", s.title));
      const meta = el("span", "meta" + (dim ? " d" : "")); add(meta, sp("", s.who || ""), tag(s.on), linkify(s.for || "", dim ? "d" : ""));
      row.append(meta);
      const prev = k ? p.steps[k - 1].state : "";
      const stx = st === "done" ? sp("g", "✓ готово") : st === "run" ? sp("b", "▸ идёт" + (s.pct != null ? " " + s.pct + " %" : "") + (s.eta_min != null ? " · ~" + mins(s.eta_min) : "")) :
        st === "wait" ? sp("a k", "⏸ ждёт вас" + (s.started ? " с " + s.started : "")) : st === "bad" ? sp("r", "✗ проблема") : sp("d", prev === "wait" ? "○ после ответа" : "○ впереди");
      const tm = st === "done" ? (s.finished || "—") : st === "run" ? (s.started ? "с " + s.started : "—") : st === "wait" ? ((q && q.wait_min != null) ? mins(q.wait_min) : p.wait_min != null ? mins(p.wait_min) : "—") : "—";
      row.append(stx, sp(st === "wait" ? "a" : "d", tm));
      wrap.append(row);
      if (s.detail) wrap.append(el("div", "sdet", s.detail));
    });
    return wrap;
  }
  function detailEl(p) {
    const d = el("div", "detail");
    const fl = el("div", "flow d"), steps = p.steps || [];
    (p.flow || []).forEach((f, i) => {
      const actor = (steps.find((s) => s.on === f.on && s.who !== "автомат" && s.who !== "вы") || {}).who;
      if (i) fl.append(" ", (p.flow[i - 1].on !== f.on ? "═▶" : "─▶"), " ");
      fl.append(f.text + " ", tag(f.on), " " + ((tags()[f.on] || {}).name || "") + (actor ? ", " + actor : ""));
    });
    if (p.for) { fl.append(" ", "═▶", " результат для "); if (p.for.on) fl.append(tag(p.for.on), " "); fl.append(p.for.text); }
    d.append(fl, stepsTable(p));
    for (const q of data.questions || []) if (q.process === p.id) d.append(questionBlock(q));
    return d;
  }
  function renderProcs() {
    const box = $("procs"); box.replaceChildren();
    const list = (data.processes || []).slice().sort((a, b) => (a.state === "done") - (b.state === "done"));
    for (const p of list) {
      const wrap = el("div", "proc" + (open.has(p.id) ? " open" : ""));
      const btn = el("button"); btn.type = "button"; btn.setAttribute("aria-expanded", open.has(p.id));
      const ph = el("div", "phead");
      const l = el("div", "l"); add(l, sp("d", p.n + "  "), sp("w k", p.title), "   ", flowEl(p));
      ph.append(l, statusEl(p));
      btn.append(ph);
      const pipe = el("div", "pipe");
      (p.steps || []).forEach((s, i) => { if (i) pipe.append(arrowFor(p.steps[i - 1], s)); pipe.append(chipEl(s)); });
      btn.append(pipe);
      btn.onclick = () => { open.has(p.id) ? open.delete(p.id) : open.add(p.id); renderProcs(); };
      wrap.append(btn);
      if (open.has(p.id)) wrap.append(detailEl(p));
      box.append(wrap);
    }
    if (!list.length) box.append(el("div", "d", "Процессов пока нет."));
  }
  function renderAsk() {
    const box = $("ask"); box.replaceChildren(sp("a k", "ВАШ ХОД"));
    const qs = data.questions || [];
    if (!qs.length) { box.append(sp("d", "вопросов к вам нет")); return; }
    for (const q of qs) box.append(questionBlock(q));
  }
  function renderFeed() {
    const box = $("feed"); box.replaceChildren(sp("d k", "ЛЕНТА"));
    for (const f of (data.feed || []).slice(-6)) {
      const [ic, c] = ICON[f.state] || ICON.todo, r = el("div", "feedrow");
      add(r, sp("d", f.time || ""), " ", sp(c, ic), " ");
      for (const m of f.on || []) r.append(tag(m));
      if (f.to) r.append(sp("d", "→"), tag(f.to));
      r.append(" " + (f.text || "")); box.append(r);
    }
  }
  function render() {
    renderHead(); renderCards(); renderProcs(); renderAsk(); renderFeed();
    if (isSample) notice("Пример — " + (sampleWhy || "живые данные в приложении Claude на компьютере с проектом."));
  }

  // ---- опрос сборщика (обработка ошибок — как в page.html) ----------------------------------------------------------
  const schedule = (ms) => { clearTimeout(timer); if (!stopped && !document.hidden) timer = setTimeout(poll, ms); };
  const retry = (text) => notice(text, { button: "Проверить снова", onClick: () => { stopped = false; notice(null); poll(); } });
  async function poll() {
    if (!mcp) return;
    clearTimeout(timer);
    const signal = typeof AbortSignal !== "undefined" && AbortSignal.timeout ? AbortSignal.timeout(15000) : undefined;
    try {
      const res = await mcp.callTool(SERVER, "pulse_status", {}, { cache: false, signal });
      const d = res && res.payload;
      if (d && d.view2) { data = d.view2; isSample = false; sampleWhy = ""; notice(d.error ? "Сборщик сообщил об ошибке: " + d.error : null, { bad: !!d.error }); render(); }
      else { sampleWhy = "сборщик ещё не отдаёт view2 (старая версия: создайте файл .claude/pulse/stop, экран поднимет новый)."; if (isSample) render(); else notice("Сборщик ответил без view2. Повторю через 10 секунд."); }
      schedule(PERIOD);
    } catch (e) {
      const code = (e && e.code) || "upstream_error";
      if (code === "server_not_connected") { stopped = true; retry("Сборщик rpv-pulse не подключён к приложению Claude. Он уже прописан в настройках: перезапустите приложение Claude на компьютере с проектом и нажмите «Проверить снова»."); }
      else if (["not_in_manifest", "not_granted", "blocked_by_policy", "approval_required"].includes(code)) {
        stopped = true;
        notice("Доступ к сборщику для этой страницы выключен. Включите его в разрешениях страницы.", { button: "Открыть разрешения", onClick: async () => { try { const p = await claude.use("permissions"); if (p) await p.manage(); } catch (_) {} stopped = false; poll(); } });
      }
      else if (code === "cancelled" && signal && signal.aborted) { notice("Сборщик не ответил за 15 секунд. Обычно это значит, что приложение Claude ещё не подключило сборщик rpv-pulse: перезапустите приложение Claude. Пробую снова каждые 30 секунд.", { button: "Проверить сейчас", onClick: () => { stopped = false; poll(); } }); schedule(30000); }
      else if (code === "cancelled") { stopped = true; retry("Запрос к сборщику отклонён в приложении."); }
      else if (code === "capability_disabled" || code === "capability_removed") { stopped = true; notice("Живые данные здесь недоступны. Откройте страницу в приложении Claude на компьютере с проектом."); }
      else if (code === "tool_error") { notice("Сборщик ответил ошибкой: " + (e.message || "без текста") + ". Повторю через 30 секунд.", { bad: true }); schedule(30000); }
      else { notice("Сборщик сейчас не отвечает. Показываю последнюю сводку, повторю через 30 секунд."); schedule(e && e.retryAfterMs ? Math.max(e.retryAfterMs, 10000) : 30000); }
    }
  }
  document.addEventListener("visibilitychange", () => { if (!document.hidden && !stopped && mcp) poll(); else clearTimeout(timer); });

  (async () => {
    open.add(SAMPLE.view2.processes[1] && SAMPLE.view2.processes[1].id);
    render();
    try { mcp = await window.claude?.use?.("mcp"); } catch (_) { mcp = null; }
    if (!mcp) { sampleWhy = "живые данные в приложении Claude на компьютере с проектом."; render(); return; }
    sampleWhy = "подключаюсь к сборщику…"; render();
    poll();
  })();
})();
</script>
