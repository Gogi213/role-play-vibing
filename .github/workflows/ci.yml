name: ci
on:
  pull_request:
  push:
    branches: [main]
    tags: ["*"]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # PR: одна версия Python (быстрый круг); main, теги и ручной запуск: полная матрица 3×3 (TK-095)
        python: ${{ fromJSON(github.event_name == 'pull_request' && '["3.12"]' || '["3.11","3.12","3.13"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest pytest-xdist
      - run: python -m pytest .claude tools -q -p no:cacheprovider -n auto --durations=15
  jobrun-systemd:
    # CP6: итог задания на машине без шины — файл <unit>.rc от ExecStopPost; здесь — настоящий systemd, не подделка
    name: jobrun на настоящем systemd
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: успех и провал пишут файл итога
        run: |
          set -e
          check() {  # <метка> <ожидаемая строка> -- <команда…>
            label=$1; want=$2; shift 3
            out=$(sudo RPV_JOBRUN_MODE=systemd RPV_RUNS_DIR=/var/lib/rpv/runs tools/jobrun.sh "$label" -- "$@")
            echo "$out"
            rc=${out##*RC=}
            for i in $(seq 30); do sudo test -f "$rc" && break; sleep 1; done
            sudo cat "$rc"
            sudo grep -qx "$want" "$rc"
          }
          check ok "SERVICE_RESULT=success EXIT_STATUS=0" -- /bin/true
          check bad "SERVICE_RESULT=exit-code EXIT_STATUS=3" -- /bin/sh -c 'exit 3'
  e2e:
    # CP11 (критерий 17): чистый проект → /rpv-init → цель → роли под диспетчером → результат, принятый Судьёй; время и
    # цена. Настоящие запуски claude стоят денег (Windows 14.10: ~$0.5 за прогон) — только ручной запуск CI и только
    # при секрете ANTHROPIC_API_KEY; нет секрета — шаг пропускается. Windows — на машине владельца.
    name: чистый проект (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: замер
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "::notice::нет секрета ANTHROPIC_API_KEY — замер пропущен"; exit 0; fi
          npm install -g @anthropic-ai/claude-code
          git config --global user.name e2e
          git config --global user.email e2e@example.invalid
          python tools/e2e_clean_project.py --keep
  ci-ok:
    name: ci-ok
    if: always()
    needs: [test, jobrun-systemd]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = "success" && test "${{ needs.jobrun-systemd.result }}" = "success"
